<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<meta name="application-name" content="日格">
<meta name="apple-mobile-web-app-title" content="日格">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<title>日格</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F2F2F7;color:#1C1C1E;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overscroll-behavior:none}
body{overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#fff;z-index:999;pointer-events:none}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:40;background:var(--bg)}
#edge-underlay{position:fixed;inset:0;z-index:39;background:var(--bg);overflow:hidden;pointer-events:none}
#edge-underlay .ua{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{padding:12px 16px 0;flex:0 0 auto}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hdate{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.6px}
.hweek{font-size:14px;font-weight:500;color:#6B6B70;padding-bottom:4px;white-space:nowrap}
.hsub{font-size:12px;color:#8E8E93;margin-top:3px}
.mid{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:8px 16px 10px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:10px 8px;width:100%;height:min(100%,560px)}
.day{height:auto;min-height:170px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden;display:flex;flex-direction:column;border:1.5px solid transparent;position:relative}
.day.today{border-color:#1F4FD8}
.day.future{border:1.5px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dh{height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#F2F2F7}
.day.today .dh{background:#1F4FD8;color:#fff}
.day.future .dh{background:#F2F2F7}
.day.rest{background:var(--rest-bg)}
.day.rest .dh{background:#F0E7D7}
.dnum{font-size:15px;font-weight:700;line-height:1}
.dwk{font-size:9.5px;opacity:.85}
.db{flex:1;padding:7px 5px 6px;overflow:hidden}
.item{position:relative;padding-left:8px;margin-bottom:7px}
.dot{position:absolute;left:0;top:5px;width:5px;height:5px;border-radius:50%;background:#B8B8BF}
.dot.p0{background:#E5484D}
.dot.p1{background:#B8B8BF}
.dot.p2{background:#D8D8DE}
.day.today .dot.p0{background:#FFFFFF;box-shadow:0 0 0 1.5px rgba(0,0,0,.14)}
.day.today .dot.p1{background:rgba(255,255,255,.62)}
.day.today .dot.p2{background:rgba(255,255,255,.34)}
.p0tag,.p2tag{display:inline-block;font-size:7.5px;line-height:9px;font-weight:700;padding:0 1.5px;border-radius:3px;vertical-align:1px}
.p0tag{color:#C93A3A;background:#FFF0F0}
.p2tag{color:#8E8E93;background:#F0F0F4}
.day.today .p0tag{color:#C93A3A;background:#FFF0F0}
.day.today .p2tag{color:rgba(255,255,255,.72);background:rgba(255,255,255,.14)}
.tt{display:flex;align-items:baseline;justify-content:space-between;gap:2px;font-size:9.5px;line-height:11px;color:#5B6B8C;margin-bottom:1px;white-space:nowrap}
.tt>span:first-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ak{flex:0 0 auto;font-size:9px;line-height:11px;font-weight:500}
.akr{display:inline-flex;align-items:baseline;gap:2px;flex:0 0 auto}
.ak.occur{color:#2F6BFF}
.ak.due{color:#F08A24}
.ti{font-size:10px;line-height:12.5px;color:#1C1C1E;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.more{font-size:9px;color:#8E8E93;margin-top:1px}
.futurecount{font-size:11px;color:#6B6B70;margin:2px 0 6px}
.bottom{flex:0 0 auto;padding:8px 16px 10px}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:#1F4FD8;color:#fff;font-size:16px;font-weight:500;font-family:inherit}
.btn:active{opacity:.85}
.btn{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.btn-hint{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:400;opacity:.72}
.subline{margin-top:8px;display:flex;justify-content:center;gap:14px;font-size:11px;color:#8E8E93}
.subline span{padding:4px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:50;animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(14px + env(safe-area-inset-bottom));max-height:95dvh;overflow-y:auto;animation:up .28s cubic-bezier(.32,.72,0,1)}
.grabber{width:36px;height:4px;border-radius:2px;background:#D1D1D6;margin:2px auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stitle{font-size:17px;font-weight:600}
.sclose{font-size:15px;color:#1F4FD8;padding:6px}
textarea,input,select{font-family:inherit;font-size:16px;color:#1C1C1E;outline:none}
textarea:focus,input:focus,select:focus{outline:none;box-shadow:none}
.pastebox{width:100%;min-height:210px;border:1px solid #E5E5EA;border-radius:14px;padding:12px;background:#FAFAFC;resize:vertical;line-height:1.55}
.importbox{display:flex;gap:8px;align-items:stretch;margin:0 4px}
.importbox textarea{flex:1;min-width:0;min-height:80px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);color:var(--ink);font-family:inherit;font-size:13.5px;line-height:1.5;resize:none}
.importbox textarea:focus{outline:none;border-color:var(--blue)}
.importplus{width:46px;min-height:80px;border-radius:14px;border:1.5px dashed var(--line);background:var(--accent-softer);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.importplus:active{transform:scale(.94)}
.mini{height:38px;padding:0 14px;border-radius:10px;border:1px solid #E5E5EA;background:#fff;color:#1F4FD8;font-size:13px;font-family:inherit}
.mini.primary{background:#1F4FD8;border-color:#1F4FD8;color:#fff}
.mini.ghost{color:#6B6B70}
.rowbtns{display:flex;gap:8px;margin-top:10px}
.rowbtns .mini{flex:1}
.pcard{border:1px solid #E5E5EA;border-radius:14px;padding:12px;margin-top:10px;background:#fff;position:relative;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.pcard.sel{border-color:#1F4FD8;background:#F7F9FF;box-shadow:0 0 0 1px #1F4FD8 inset}
.pcheck{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid #C7C7CC;background:#fff;box-sizing:border-box}
.pcard.sel .pcheck{background:#1F4FD8;border-color:#1F4FD8}
.pcard.sel .pcheck:after{content:"";position:absolute;left:6px;top:4px;width:6px;height:10px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.ptitle{font-size:16px;font-weight:600;line-height:1.35;word-break:break-all;padding-right:30px}
.phint{font-size:12px;color:#8E8E93;margin:8px 2px 0;line-height:1.5}
.mini.primary:disabled{opacity:.45}
.praw{font-size:11px;line-height:1.5;color:#8E8E93;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11px;padding:4px 8px;border-radius:999px;background:#F2F2F7;color:#6B6B70;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.blue{background:#E8EEFF;color:#1F4FD8}
.chip.orange{background:#FFF2E3;color:#C26A10}
.chip.grey{background:#F2F2F7;color:#8E8E93}
.nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.nav .back{font-size:15px;color:#1F4FD8;padding:4px 2px}
.nav .nt{font-size:17px;font-weight:600}
.scroll{flex:1 1 auto;overflow-y:auto;padding:0 16px 30px;-webkit-overflow-scrolling:touch}
.sect{font-size:12px;color:#8E8E93;margin:16px 4px 8px;display:flex;justify-content:space-between}
.tr{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:12px;margin-bottom:8px}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid #C7C7CC;flex:0 0 20px;margin-top:2px;position:relative}
.check.done{background:#E5E5EA;border-color:#E5E5EA}
.check.done:after{content:"";position:absolute;left:5px;top:3px;width:6px;height:10px;border:1.5px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.trmain{flex:1;min-width:0}
.trtitle{font-size:15px;line-height:1.4;word-break:break-all}
.trtitle.done{color:#8E8E93}
.trmeta{font-size:11px;color:#8E8E93;margin-top:4px;line-height:1.5}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.act{font-size:11px;padding:5px 9px;border-radius:8px;border:1px solid #E5E5EA;background:#fff;color:#6B6B70;font-family:inherit}
.act.blue{color:#1F4FD8;border-color:#C9D6FF}
.act.red{color:#E5484D;border-color:#F6D2D4}
.empty{text-align:center;color:#8E8E93;font-size:13px;padding:40px 0;line-height:1.7}
.field{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.field label{display:block;font-size:12px;color:#8E8E93;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:none;background:transparent;outline:none;font-size:16px;padding:0}
.field textarea{min-height:96px;resize:none;line-height:1.5;overflow:hidden}
.seg{display:flex;background:#F2F2F7;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:6px 0;font-size:13px;color:#6B6B70;font-family:inherit}
.seg button.on{background:#fff;color:#1C1C1E;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.field2 .field{margin-bottom:0}
.labrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.labrow label{margin-bottom:0!important}
.maplinks{display:flex;gap:4px}
.mapbtn{font-size:11px;padding:4px 9px;border-radius:8px;border:none;background:#E8EEFF;color:#1F4FD8;font-family:inherit}
.chunk{display:inline-block;margin:5px 5px 0 0;padding:7px 11px;border-radius:10px;background:#F2F2F7;border:none;font-size:14px;color:#3A3A3C;font-family:inherit}
.chunk.on{background:#1F4FD8;color:#fff}
.bbpreview{font-size:20px;font-weight:600;line-height:1.4;word-break:break-all}
.bbcount{font-size:12px;color:#8E8E93}
.bbcount.warn{color:#F08A24}
.bbcount.bad{color:#E5484D}
.cands{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cand{font-size:12px;padding:6px 10px;border-radius:999px;background:#E8EEFF;color:#1F4FD8;border:none;font-family:inherit}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:rgba(28,28,30,.9);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;transition:.2s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ================= v13 视觉系统：只改观感，不缩小八日格 ================= */
:root{--bg:#F5F5F7;--card:#FFFFFF;--ink:#1C1C1E;--muted:#8E8E93;--blue:#3157D5;--line:#E9E9EE;--danger:#E5484D;--accent-soft:#EAF0FF;--accent-softer:#F5F7FF;--accent-line:#DCE5FF;--rest-bg:#FAF5EB;--today-shadow:0 4px 14px rgba(49,87,213,.18)}
html[data-theme="pink"]{--bg:#FBF3F6;--card:#FFFFFF;--ink:#1C1C1E;--muted:#8E8E93;--blue:#E2699A;--line:#F0E2E9;--danger:#E5484D;--accent-soft:#FBE9F1;--accent-softer:#FDF3F7;--accent-line:#F3D3E1;--rest-bg:#F1ECFA;--today-shadow:0 4px 14px rgba(226,105,154,.22)}
html,body{background:var(--bg)}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,[data-act]:focus-visible{outline:2px solid rgba(49,87,213,.45);outline-offset:2px}
.ic{width:1em;height:1em;display:inline-block;vertical-align:middle;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{padding:12px 16px 0}
.hrow{align-items:flex-start;gap:12px}
.hmeta{flex:1;min-width:0}
.hdaterow{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.hdate{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.6px}
.hweek{font-size:13px;font-weight:500;color:#6B6B70;padding:0}
.hsub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.05px}
.icon-btn{width:44px;height:44px;padding:0;border:0;border-radius:14px;background:transparent;color:#3A3A3C;display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:transform .16s ease,background .16s ease,color .16s ease}
.icon-btn:active{transform:scale(.92);background:rgba(0,0,0,.055)}
.icon-btn.danger{color:var(--danger)}
.menu-trigger{margin:-3px -5px 0 0;background:#ECECF1;color:#3A3A3C;border-radius:14px;width:42px;height:42px}
.menu-trigger .ic{font-size:25px}
.badge{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--blue);color:#fff;font-size:10px;line-height:17px;text-align:center;font-weight:600;border:2px solid var(--bg);box-sizing:content-box}

/* 尺寸锁定：与原网页完全一致，不能因视觉稿而缩小 */
.mid{padding:8px 16px 10px}
.grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:10px 8px;width:100%;height:min(100%,560px)}
.day{min-height:170px;border-radius:15px;border:1.5px solid transparent;background:var(--card);box-shadow:0 2px 8px rgba(20,24,40,.045);transition:transform .16s ease,box-shadow .16s ease}
.day:active{transform:scale(.985)}
.dh{height:32px;flex:0 0 32px;background:transparent;padding:0 8px}
.day .dh,.day.future .dh{background:transparent}
.day.today{background:var(--blue);border-color:var(--blue);box-shadow:var(--today-shadow)}
.day.today .dh{background:transparent;color:#fff}
.day.today .tt,.day.today .ti,.day.today .ak,.day.today .ak.occur,.day.today .ak.due,.day.today .more{color:#fff}
.day.today .tt,.day.today .ak{opacity:.82}
.day.today .ti{opacity:1}
.day.rest{background:var(--rest-bg)}
.day.rest .dh{background:transparent}
.db{padding:7px 6px 6px}
.ti{font-weight:500}
.tt{color:#627092}

.bottom{padding:8px 16px 12px;display:flex;justify-content:center}
.btn.composer{width:auto;min-width:0;padding:0 20px;height:50px;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:0 4px 18px rgba(20,24,40,.10);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:550;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.btn.composer:active{transform:scale(.965);box-shadow:0 2px 8px rgba(20,24,40,.08)}
.btn.composer>.ic{font-size:21px;color:#4A4A4F}

.backdrop{background:rgba(0,0,0,.18)}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 36px rgba(20,24,40,.10);padding:8px 16px calc(14px + env(safe-area-inset-bottom));scrollbar-width:none}
.sheet::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
.grabber{width:36px;height:4px;background:#D4D4D9;margin:2px auto 8px;position:relative;touch-action:none;cursor:grab}
.grabber::before{content:"";position:absolute;left:-22px;right:-22px;top:-12px;bottom:-12px}
.grabber:active{background:#AEAEB5}
.shead{min-height:42px;margin-bottom:8px}
.stitle{font-size:17px;font-weight:650}
.sclose{padding:0;color:#6B6B70}
.pastebox{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 1px 2px rgba(20,24,40,.025)}
.mini{height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;transition:transform .15s ease,background .15s ease}
.mini:active,.act:active,.mapbtn:active{transform:scale(.96)}
.mini.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.mini.ghost{color:#6B6B70;background:#ECECF1;border-color:transparent}
.rowbtns{gap:9px;margin-top:12px}
.pcard{border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 7px rgba(20,24,40,.035)}
.pcard.sel{border-color:var(--blue);background:var(--accent-softer);box-shadow:0 0 0 1px var(--blue) inset}
.pcard.sel .pcheck{background:var(--blue);border-color:var(--blue)}
.chip.blue{background:var(--accent-soft);color:var(--blue)}
.act{min-height:32px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:#5E5E64}
.act.blue{color:var(--blue);border-color:var(--accent-line);background:var(--accent-softer)}
.act.red{color:var(--danger);border-color:#F6D2D4;background:#FFF8F8}
.act.icon-only{width:36px;padding:0}
.actions{align-items:center}
.nav{padding:10px 12px 8px;gap:4px;min-height:54px;background:var(--bg)}
.nav .back{padding:0;color:#3A3A3C}
.nav .nt{font-size:17px;font-weight:650;margin-left:2px}
.nav .cal-today-btn{margin-left:auto}
.scroll{padding:0 16px 30px}
.sect{margin:17px 4px 8px;font-weight:500}
.tr{border-radius:15px;padding:13px 12px;box-shadow:0 2px 7px rgba(20,24,40,.035);border:1px solid rgba(233,233,238,.8)}
.field{background:#fff;border:1px solid rgba(233,233,238,.9);border-radius:15px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,24,40,.02)}
.field label{color:#8E8E93;margin-bottom:6px}
.field label .ic,.labrow>label .ic{margin-right:5px}
.seg{background:rgba(120,120,128,.16);border-radius:12px;padding:3px}
.seg button{border-radius:9px;min-height:32px;color:#1C1C1E;transition:background .18s ease,color .18s ease}
.seg button.on{background:#fff;color:#1C1C1E;font-weight:500;box-shadow:0 2px 6px rgba(0,0,0,.13),0 .5px 1.5px rgba(0,0,0,.08)}
.prio-seg button[data-v="0"].on{color:#C93A3A;font-weight:600}
.prio-seg button[data-v="2"].on{color:#6B6B70}
.mapbtn{display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);color:var(--blue);border-radius:9px;padding:5px 8px}
.chunk{background:#ECECF1;border-radius:11px}
.chunk.on{background:var(--blue)}
.cand{background:var(--accent-soft);color:var(--blue)}
.editor-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;width:100%}
.editor-head .stitle{text-align:center}
.editor-head .icon-btn{margin:-8px}
.editor-title-field{padding:13px 14px 12px}
.editor-title-input{font-size:21px!important;line-height:1.35;font-weight:650;letter-spacing:-.2px}
.editor-tools{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:8px}
.editor-tools .act{background:transparent;border-color:transparent;padding-left:2px;padding-right:2px}
.note-field textarea{min-height:108px}
/* 任务编辑页：整体固定不滚动，只有备注框内部可滚动 */
.sheet.editor-fixed{display:flex;flex-direction:column;overflow:hidden;height:95dvh}
.sheet.editor-fixed>*{flex:0 0 auto}
.sheet.editor-fixed .note-field{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.sheet.editor-fixed .note-field textarea{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* 矮屏保险：空间不够时退回整页滚动，避免按钮被挤出屏幕 */
@media (max-height:720px){
  .sheet.editor-fixed{height:auto;max-height:95dvh;overflow-y:auto}
  .sheet.editor-fixed .note-field{flex:0 0 auto}
  .sheet.editor-fixed .note-field textarea{min-height:108px}
}
.save-editor{width:100%;height:46px;font-size:15px}
.save-editor .ic{font-size:17px}
.empty{color:#8E8E93}

.menu-backdrop{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.035);animation:fade .14s ease}
.quick-menu{position:fixed;z-index:45;top:calc(env(safe-area-inset-top) + 62px);right:16px;width:202px;padding:6px;background:rgba(255,255,255,.98);border:1px solid rgba(233,233,238,.9);border-radius:18px;box-shadow:0 12px 36px rgba(20,24,40,.16);animation:menuIn .18s cubic-bezier(.2,.8,.2,1);transform-origin:top right}
.quick-item{width:100%;height:48px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--ink);display:flex;align-items:center;gap:11px;text-align:left;font-size:15px;cursor:pointer}
.quick-item:active{background:#F0F0F4}
.quick-item .ic{font-size:20px;color:#5E5E64}
.quick-item .qtext{flex:1}
.quick-count{font-size:11px;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--blue);font-weight:600}
@keyframes menuIn{from{opacity:0;transform:scale(.94) translateY(-5px)}to{opacity:1;transform:scale(1) translateY(0)}}
.edge-dragging{transition:none!important;animation:none!important;will-change:transform;touch-action:none}
.edge-settle{transition:transform .26s cubic-bezier(.32,.72,0,1)!important;animation:none!important;will-change:transform}
.version-area{margin:18px 4px 4px;text-align:left}
.version-btn{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:0;border-radius:11px;background:var(--accent-soft);color:var(--blue);font-size:13px;font-weight:700;letter-spacing:.2px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.version-hint{font-size:11px;color:#8E8E93;margin:7px 0 8px;line-height:1.5}
.argus-badge{margin-left:8px;background:var(--accent-soft);color:var(--blue);border:1px solid var(--accent-line)}
.version-hero{padding:16px 16px 15px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.version-big{font-size:28px;line-height:1.2;font-weight:750;color:var(--blue);letter-spacing:-.4px}
.version-sub{font-size:12px;color:#8E8E93;margin-top:6px}
.version-log{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:8px}
.version-log .ic{font-size:17px;color:var(--blue);margin-top:1px}
.version-log-title{font-size:14px;font-weight:650;line-height:1.4}
.version-log-text{font-size:12px;color:#6B6B70;line-height:1.55;margin-top:3px}
.version-foot{font-size:11px;color:#8E8E93;line-height:1.6;margin:12px 4px 2px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== 日历 ===== */
.calscroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 30px;scrollbar-width:none;overflow-anchor:none}
.calscroll::-webkit-scrollbar{display:none}
.calmonth{margin:0 auto 14px;max-width:640px}
.calmhead{font-size:16px;font-weight:700;color:var(--ink);padding:10px 4px 8px}
.calwd{display:grid;grid-template-columns:repeat(7,1fr);padding:0 0 4px}
.calwd span{font-size:11px;color:var(--muted);text-align:center}
.calwd span:first-child,.calwd span:last-child{color:var(--blue)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calcell{min-height:52px;background:var(--card);border-radius:10px;padding:5px 4px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid transparent}
.calcell.empty{background:transparent}
.cald{font-size:15px;font-weight:600;color:var(--ink);line-height:1.15}
.call{font-size:10px;color:var(--muted);line-height:1.2;white-space:nowrap;transform:scale(.92)}
.calcell.wk .cald{color:var(--blue)}
.calcell.wk{background:var(--accent-softer)}
.calcell.hol{background:var(--accent-soft)}
.calcell.hol .cald{color:var(--danger)}
.calcell.work{background:var(--card)}
.calcell.work .cald{color:var(--ink)}
.caltag{font-size:9px;line-height:1;padding:2px 4px;border-radius:5px;white-space:nowrap;transform:scale(.95)}
.caltag.hol{color:var(--danger);background:rgba(229,72,77,.10)}
.caltag.work{color:#8E8E93;background:#F2F2F7}
.calcell.today{border-color:var(--blue);box-shadow:0 2px 8px var(--accent-line)}
.calcell.today .cald{color:var(--blue)}
.calhint{text-align:center;font-size:11px;color:var(--muted);padding:6px 0 2px}
/* ===== 大屏适配（iPad mini / 大屏 iPhone 横屏等） ===== */
@media(min-width:700px){
  #app{max-width:720px;margin:0 auto}
  .sheet{left:0;right:0;margin:0 auto;max-width:720px}
  .quick-menu{right:max(16px,calc(50% - 360px))}
  .calcell{min-height:64px}
}

function parseTime(str, ctxPeriod){

  var m;
  var PER=/(上午|早上|早晨|凌晨|中午|下午|午后|晚上|傍晚|夜里|夜间|今晚|今夜|明晚|昨晚|晚)/;
  function periodNear(index,len){
    var pre=str.slice(Math.max(0,index-8),index);
    var hit=pre.match(new RegExp(PER.source,"g"));
    if(hit && hit.length) return hit[hit.length-1];
    var post=str.slice(index+len,index+len+4).match(PER);
    if(post) return post[1];
    // 同一句话里前文出现过“下午/晚上”，后半句的“4点/9点”应沿用该时段；
    // 但只在时间点附近没有时段词时兜底，避免“上午10:00”被后面的“下午”误加成 22:00。
    var all=str.slice(0,index).match(new RegExp(PER.source,"g"));
    if(all && all.length) return all[all.length-1];
    return ctxPeriod||"";
  }
  function applyPeriod(h,per){
    if(/(下午|午后|晚上|傍晚|今晚|今夜|明晚|昨晚|晚|夜里|夜间)/.test(per) && h<12) h+=12;
    if(/中午/.test(per) && h<11) h+=12;

  }

  if(m){
    var h=applyPeriod(+m[1],periodNear(m.index,m[0].length)), mi=+m[2];
    if(h>23||mi>59) return null;
    return pad2(h)+":"+pad2(mi);
  }
  m = str.match(/(上午|早上|早晨|凌晨|中午|下午|午后|晚上|傍晚|夜里|夜间|今晚|今夜|明晚|昨晚|晚)?\s*(\d{1,2}|[一二两三四五六七八九十]{1,2})\s*点\s*(半|[一二两三四五六七八九十]{1,2}|\d{1,2}\s*分?)?/);

    var hRaw=m[2], per=m[1]||periodNear(m.index,m[0].length);

  if(/下班前/.test(str)) return "17:30";

    var n=cnNum(m[1]);
    if(/下午|午后|中午|傍晚|晚上/.test(str) && n>=1 && n<=4) n+=4;

  if(/下午|午后/.test(str)) return "14:30";

      var arrival=!hasDate && /(报到|签到|集合|入场)/.test(p) && /(参会|参加|全体|教师|人员)/.test(p);
      var onlyWhen=hasDate && !isTaskish(p,base);
      if(onlyWhen && cur && isTaskish(cur,base)){
        cur=cur+"，"+p;
        curHasWhen=true;
        return;
      }
      var newTaskish=(hasDate || isTaskish(p,base)) && !aux && !arrival;
      if(newTaskish && (curHasWhen || hasDate || (cur && isTaskish(cur,base)))){
        if(cur && isTaskish(cur,base)) out.push(cur);
        else if(cur) p=cur+"，"+p;
        cur=p;
      } else {
        cur = cur ? cur+"，"+p : p;
      }
      if(hasDate || hasTime) curHasWhen=true;
    });
    if(cur) out.push(cur);
  });
  var seen={}, res=[];
  var lastDate=ctx.date?new Date(ctx.date.getFullYear(),ctx.date.getMonth(),ctx.date.getDate()):null;
  var lastPeriod=ctx.period||"";
  out.forEach(function(raw){
    var s=cleanSegment(raw);
    if(!s) return;
    var placeLine=/^(?:会议地点|活动地点|地点|地址)\s*:/.test(s);
    if(placeLine && res.length){
      var pLine=parsePlace(s);
      if(pLine){
        var prevPlace=res[res.length-1];
        prevPlace.place=pLine;
        if(prevPlace.raw.indexOf(s)<0) prevPlace.raw=prevPlace.raw+"，"+s;
        return;
      }
    }
    if(!isTaskish(s,base)){
      // 截止日期单独成句时，粘回上一张卡，而不是生成一张只有日期的空卡。
      var dl=parseDate(s,base), dlt=parseTime(s);
      if((dl.date || dlt) && /(截止|之前|以前|前)/.test(s) && res.length){
        var prevDl=res[res.length-1];
        if(dl.date){ prevDl.date=fmtYMD(dl.date); lastDate=new Date(dl.date.getFullYear(),dl.date.getMonth(),dl.date.getDate()); }
        if(dlt) prevDl.time=dlt;
        prevDl.anchor="due";
        if(prevDl.raw.indexOf(s)<0) prevDl.raw=prevDl.raw+"，"+s;
        return;
      }
      return;
    }
    var key=s.replace(/\s/g,"");
    if(seen[key]) return;
    seen[key]=1;
    var srcDate=s;
    var mm=s.match(/(?:改到|调整到|改期到|推迟到|提前到|时间改为|改为)\s*(.+)$/);
    if(mm) srcDate=mm[1];
    var d=parseDate(srcDate,base);
    if(!d.date) d=parseDate(s,base);
    if(!d.date && lastDate) d={date:lastDate,text:""};
    var perMatch=s.match(/(上午|早上|早晨|凌晨|中午|下午|午后|晚上|傍晚|今晚|今夜|明晚|昨晚|夜里|夜间|晚)/);
    if(perMatch) lastPeriod=perMatch[1];
    var tm=parseTime(s,lastPeriod);
    // “请于7:40前”省略了日期，默认是收到通知当天；带“每天/每周”的周期任务不这样处理。
    if(!d.date && tm && /(前|之前|以前|截止)/.test(s) && !/(每天|每周|每星期|每学期|工作日)/.test(s)){
      d={date:new Date(base.getFullYear(),base.getMonth(),base.getDate()),text:""};
    }
    if(d.date && d.date.getTime()<base.getTime()) return;
    if(d.date) lastDate=new Date(d.date.getFullYear(),d.date.getMonth(),d.date.getDate());
    var endTm=parseTimeRange(s,lastPeriod);
    var place=parsePlace(s);
    var anchor=decideAnchor(s,{place:place,time:tm});
    var cat=categoryOf(s);
    var title=titleOf(s);
    var now=Date.now();
    res.push({
      id:uid(), title:title, raw:s, note:"", agenda:[],
      anchor:anchor, date:d.date?fmtYMD(d.date):null, time:tm, endTime:endTm,
      place:place, category:cat, tags:[], priority:1, status:"todo", doneAt:null,
      leadDays:null, repeat:null, source:"parsed", relevant:true, reference:false,
      batchId:"", createdAt:now, updatedAt:now
    });
  });
  res=mergeTaskFragments(res);
  res=mergeClauseTasks(res);
  res=addPrepCompanions(res);
  var batch=res.length?uid():"";
  res.forEach(function(x){ x.batchId=batch; });
  return res;
}
function parseAll(text, base, settings){
  var t=normalizeText(text);
  if(!t) return [];
  var contentLabel=/(?:内容|议程)\s*:/.test(t);
  var listCount=t.split("\n").filter(function(l){ return isListLine(l.trim()); }).length;
  var numberedContent=contentLabel && listCount>=2;
  if(isNotice(t) || numberedContent) return parseNotice(t, base, settings);
  return parseMulti(t, base, settings);
}
function taskClauseCount(text, base){
  var t=normalizeText(text);
  var raw=[];
  t.split(/\n+/).forEach(function(line){
    line.split(/[。！？]/).forEach(function(x){ if(x.trim()) raw.push(x.trim()); });
  });
  var tmp=[];
  raw.forEach(function(line){
    line.split(/；|;/).forEach(function(x){ if(x.trim()) tmp.push(x.trim()); });
  });
  var out=[];
  tmp.forEach(function(s){
    s.split(/(?:另外|还有|顺便|同时|此外|然后|接着|随后|之后再)/).forEach(function(x){
      if(x.trim()) out.push(x.trim().replace(/^[，,、\s]+/,""));
    });
  });
  var n=0;
  out.forEach(function(s){
    s.split(/[，,、]/).forEach(function(p){
      var c=cleanSegment(p);
      // 阿尔戈斯 1.5：交付从句（“发给我”）与寒暄铺垫会被并回主任务，不算独立任务数。
      if(c && isTaskish(c,base) && !isDeliveryClause(c) && !isPreambleClause(c)) n++;
    });
  });
  return n;
}
/* ================= PARSER END ================= */

function lsReadTasks(){
  try{ var a=JSON.parse(localStorage.getItem("rige_tasks")||"[]"); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function taskVersion(t){ var n=Number(t&&t.updatedAt); return Number.isFinite(n)?n:0; }
function newerRecord(a,b){ return !a || taskVersion(b)>=taskVersion(a)?b:a; }
var Store = {
  mode:"ls", db:null, deleted:{},
  init:function(){
    var self=this;
    return new Promise(function(res){
      try{
        if(!window.indexedDB){ self.mode="ls"; res(); return; }
        var r=indexedDB.open("rige",1);
        r.onupgradeneeded=function(){ var d=r.result; if(!d.objectStoreNames.contains("tasks")) d.createObjectStore("tasks",{keyPath:"id"}); };
        r.onsuccess=function(){ self.db=r.result; self.mode="idb"; res(); };
        r.onerror=function(){ self.mode="ls"; res(); };
      }catch(e){ self.mode="ls"; res(); }
    });
  },
  fallback:function(){ this.mode="ls"; },
  idbAll:function(){
    var self=this;
    return new Promise(function(res,rej){
      try{
        var tx=self.db.transaction("tasks","readonly");
        var req=tx.objectStore("tasks").getAll();
        req.onsuccess=function(){ res(req.result||[]); };
        req.onerror=function(){ rej(req.error||new Error("IndexedDB 读取失败")); };
      }catch(e){ rej(e); }
    });
  },
  idbPut:function(t){
    var self=this;
    return new Promise(function(res,rej){
      try{
        var tx=self.db.transaction("tasks","readwrite");
        tx.objectStore("tasks").put(t);
        tx.oncomplete=function(){ res(); };
        tx.onerror=tx.onabort=function(){ rej(tx.error||new Error("IndexedDB 写入失败")); };
      }catch(e){ rej(e); }
    });
  },
  all:async function(){
    var primary=[];
    if(this.mode==="idb"){
      try{ primary=await this.idbAll(); }
      catch(e){ this.fallback(); }
    }
    var merged={};
    primary.concat(lsReadTasks()).forEach(function(t){
      if(t&&typeof t.id==="string"&&t.id) merged[t.id]=newerRecord(merged[t.id],t);
    });
    this.deleted={};
    Object.keys(merged).forEach(function(id){
      if(merged[id]&&merged[id]._deleted) Store.deleted[id]=taskVersion(merged[id]);
    });
    return Object.keys(merged).map(function(id){ return merged[id]; }).filter(function(t){ return t&&!t._deleted; });
  },
  put:async function(t){
    var idbOk=false,lsOk=false;
    if(this.mode==="idb"){
      try{ await this.idbPut(t); idbOk=true; }
      catch(e){ this.fallback(); }
    }
    try{ this.lsPut(t); lsOk=true; }catch(e){}
    if(!idbOk&&!lsOk) throw new Error("任务存储失败");
    if(t._deleted) this.deleted[t.id]=taskVersion(t);
    else if(this.deleted[t.id]&&taskVersion(t)>this.deleted[t.id]) delete this.deleted[t.id];
  },
  lsPut:function(t){
    var a=lsReadTasks();
    var i=-1; for(var j=0;j<a.length;j++){ if(a[j]&&a[j].id===t.id){ i=j; break; } }
    if(i>=0) a[i]=newerRecord(a[i],t); else a.push(t);
    localStorage.setItem("rige_tasks",JSON.stringify(a));
  },
  del:function(id){
    return this.put({id:id,_deleted:true,updatedAt:Date.now()});
  },
  clear:async function(){
    var tasks=await this.all();
    for(var i=0;i<tasks.length;i++) await this.del(tasks[i].id);
  }
};
async function putTask(t){
  try{ await Store.put(t); return true; }
  catch(e){ toast("保存失败：请检查存储空间，并先导出备份"); return false; }
}
async function deleteStoredTask(id){
  try{ await Store.del(id); return true; }

}

function fmtMD(d){ return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function weekInfo(d){
  var baseYMD=state.settings.weekOneMonday;
  if(!baseYMD) return {n:1,label:"单周"};
  var base=new Date(baseYMD+"T00:00:00");
  var diff=Math.round((mondayOf(d).getTime()-mondayOf(base).getTime())/604800000);
  var n=diff+1;
  if(!isFinite(n)||n<1) n=1;
  var isOdd=(n%2===1);
  var label=(state.settings.oddEvenStart==="odd" ? isOdd : !isOdd) ? "单周" : "双周";
  return {n:n,label:label};
}
function sortTasks(a,b){
  var ap=normPriority(a.priority), bp=normPriority(b.priority);
  if(ap!==bp) return ap-bp;
  var at=a.time||"99:99", bt=b.time||"99:99";
  if(at!==bt) return at<bt?-1:1;
  return 0;
}
function todayStr(){ return fmtYMD(TODAY); }
function tasksOn(dateStr){
  return state.tasks.filter(function(t){ return t.date===dateStr && t.status!=="dropped" && !t.reference; }).sort(sortTasks);
}
function inboxTasks(){
  var ts=todayStr();
  var undated=state.tasks.filter(function(t){ return !t.reference && !t.date && t.status!=="done" && t.status!=="dropped"; })
    .sort(function(a,b){ return normPriority(a.priority)-normPriority(b.priority) || (a.createdAt||0)-(b.createdAt||0); });
  var overdue=state.tasks.filter(function(t){ return !t.reference && t.date && t.date<ts && t.status!=="done" && t.status!=="dropped"; })
    .sort(function(a,b){ return normPriority(a.priority)-normPriority(b.priority) || a.date.localeCompare(b.date) || sortTasks(a,b); });
  var refs=state.tasks.filter(function(t){ return t.reference; });
  return {undated:undated, overdue:overdue, refs:refs};
}

var CN_REST_RANGES=[
  ["2026-01-01","2026-01-03"],["2026-02-15","2026-02-23"],["2026-04-04","2026-04-06"],

function dayCard(d, ds, items, isToday, isFuture){
  var undone=items.filter(function(t){return t.status!=="done";});
  var shown=undone;
  var head="";
  if(isFuture){
    head='<div class="dh"><span class="dnum" style="font-size:12px;font-weight:600">以后</span><span class="dwk">'+(undone.length?undone.length+" 件":"")+'</span></div>';
  }else{
    head='<div class="dh"><span class="dnum">'+d.getDate()+'</span><span class="dwk">'+(isToday?"今天":WD_CN[d.getDay()])+'</span></div>';
  }
  var body="";
  if(!undone.length){
    body='';
  }else{
    if(isFuture) body+='<div class="futurecount">共 '+undone.length+' 件</div>';
    body+=shown.map(function(t){
      var cls=prioClass(t);
      var pt=prioText(t);
      var ak=t.anchor==="occur"?"到场":"截止";
      var whenTxt=isFuture?fmtSlash(t.date):(t.time||"全天");
      return '<div class="item" data-act="openTask" data-id="'+esc(t.id)+'">'
        +'<span class="dot '+cls+'"></span>'
        +'<div class="tt"><span>'+esc(whenTxt)+'</span><span class="akr">'+(pt?'<span class="'+(pt==="P0"?"p0tag":"p2tag")+'">'+pt+'</span>':'')+'<span class="ak '+(t.anchor==="occur"?"occur":"due")+'">'+ak+'</span></span></div>'
        +'<div class="ti">'+esc(t.title)+'</div></div>';
    }).join("");
  }
  var rest=!isToday&&!isFuture&&isRestDay(ds);
  return '<div class="day'+(isToday?" today":"")+(isFuture?" future":"")+(rest?" rest":"")+'" data-act="openDay" data-date="'+ds+'">'+head+'<div class="db">'+body+'</div></div>';
}
function fitHomeCards(){
  var cards=document.querySelectorAll(".day .db");
  for(var c=0;c<cards.length;c++){
    var db=cards[c];
    var items=Array.prototype.slice.call(db.querySelectorAll(".item"));
    if(!items.length) continue;
    var old=db.querySelector(".more"); if(old) old.parentNode.removeChild(old);
    for(var i=0;i<items.length;i++) items[i].style.display="";
    var cs=getComputedStyle(db);
    var avail=db.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0);
    var fixed=0;
    for(var k=0;k<db.children.length;k++){
      var ch=db.children[k];
      if(!ch.classList.contains("item") && !ch.classList.contains("more")) fixed+=ch.offsetHeight+4;
    }
    avail-=fixed;
    var gaps=7, total=0, heights=[];
    for(var j=0;j<items.length;j++){ var h=items[j].offsetHeight+gaps; heights.push(h); total+=h; }
    if(total<=avail) continue;
    var moreH=15, n=0, acc=0;
    for(var q=0;q<heights.length;q++){
      if(acc+heights[q]<=avail-moreH){ acc+=heights[q]; n++; } else break;
    }
    if(n<1) n=1;
    for(var r=0;r<items.length;r++) items[r].style.display=(r<n?"":"none");
    if(items.length>n){
      var more=document.createElement("div"); more.className="more"; more.textContent="+"+(items.length-n)+" 件"; db.appendChild(more);
    }
  }
}
function renderInbox(){
  var ib=inboxTasks();
  function item(t,kind){
    var pt=prioText(t);
    var pre=pt?pt+" · ":"";
    var meta="";
    if(kind==="overdue"){
      var days=Math.round((TODAY.getTime()-new Date(t.date+"T00:00:00").getTime())/864e5);
      meta=pre+"已逾期 "+days+" 天"+(t.time?" · "+t.time:"");
    }else if(kind==="undated"){
      meta=pre+"未排日期"+(t.place?" · "+t.place:"");
    }else{
      meta="可能与你无关";
    }
    return '<div class="tr"><div class="check '+(t.status==="done"?"done":"")+'" data-act="toggle" data-id="'+esc(t.id)+'"></div>'
      +'<div class="trmain">'
      +'<div class="trtitle '+(t.status==="done"?"done":"")+'" data-act="openTask" data-id="'+esc(t.id)+'">'+esc(t.title)+'</div>'
      +'<div class="trmeta">'+esc(meta)+'</div>'
      +(t.raw?'<div class="trmeta" style="color:#B0B0B5">'+esc(t.raw.slice(0,50))+'</div>':'')
      +(kind!=="refs"?'<div class="actions">'
        +'<button class="act blue" data-act="toToday" data-id="'+esc(t.id)+'">'+icon("calendar",14)+'今天</button>'
        +'<button class="act icon-only" data-act="openTask" data-id="'+esc(t.id)+'" aria-label="编辑任务" title="编辑任务">'+icon("edit",16)+'</button>'
        +'<button class="act red icon-only" data-act="delTask" data-id="'+esc(t.id)+'" aria-label="删除任务" title="删除任务">'+icon("trash",16)+'</button></div>':'')
      +'</div></div>';

  return '<div class="nav"><button class="icon-btn back" data-act="backHome" aria-label="返回主页" title="返回主页">'+icon("back",25)+'</button><span class="nt">收件箱</span></div>'

    +(ib.undated.length?'<div class="sect"><span>待安排</span><span>'+ib.undated.length+'</span></div>'+ib.undated.map(function(t){return item(t,"undated");}).join(""):"")
    +(ib.refs.length?'<div class="sect"><span>参考</span><span>'+ib.refs.length+'</span></div>'+ib.refs.map(function(t){return item(t,"refs");}).join(""):"")
    +(!ib.undated.length&&!ib.overdue.length&&!ib.refs.length?'<div class="empty">收件箱是空的<br>粘贴的通知如果没识别出日期，会先落在这里</div>':"")

function renderSheet(){
  if(state.sheet) state.quickMenu=false;
  renderQuickMenu();
  var root=document.getElementById("sheet-root");
  if(!state.sheet){ root.innerHTML=""; return; }
  var html="";
  if(state.sheet.type==="paste") html=sheetPaste();
  else if(state.sheet.type==="editor") html=sheetEditor();
  else if(state.sheet.type==="bb") html=sheetBB();
  else if(state.sheet.type==="manual") html=sheetManual();
  else if(state.sheet.type==="day") html=sheetDay();
  else if(state.sheet.type==="version") html=sheetVersion();
  else if(state.sheet.type==="argus") html=sheetArgus();
  var sheet=root.querySelector(".sheet");
  var scroll=sheet?sheet.scrollTop:0;
  var isEditor=state.sheet.type==="editor";
  if(!sheet){
    root.innerHTML='<div class="backdrop" data-act="closeSheet"></div><div class="sheet"></div>';
    sheet=root.querySelector(".sheet");
  }
  sheet.classList.toggle("editor-fixed",isEditor);
  sheet.innerHTML=html;
  sheet.scrollTop=scroll;
  var ta=document.getElementById("e_note");
  if(ta && !isEditor){
    ta.style.height="auto";
    var h=ta.scrollHeight+2;
    ta.style.height=Math.min(h,360)+"px";
    ta.style.overflowY=h>360?"auto":"hidden";
  }
}

function fmtSlash(s){ var d=new Date(s+"T00:00:00"); return (d.getMonth()+1)+"/"+d.getDate(); }
function fmtShortDate(s){
  var d=new Date(s+"T00:00:00");
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+WD_CN[d.getDay()];
}
function updateDraftSelectionUI(){
  var d=state.drafts||[], sel=state.draftSel||[];
  var root=document.getElementById("sheet-root");
  if(!root || !state.sheet || state.sheet.type!=="paste") return;
  var cards=root.querySelectorAll("#draftCards .pcard");
  for(var i=0;i<cards.length;i++) cards[i].classList.toggle("sel",!!sel[i]);
  var selN=sel.filter(Boolean).length;
  var btn=document.getElementById("addDraftsBtn");
  if(btn){
    btn.disabled=!selN;
    btn.textContent="加入选中"+(selN?" · "+selN:"");
  }
  var hint=document.getElementById("draftHint");
  if(hint) hint.textContent=selN?(d.length>1?"已选 "+selN+" 条，点下面按钮加入":"已选中，可直接点下面按钮加入"):(d.length>1?"点卡片空白处选中任务，可只选一条，也可两条都选":"点卡片空白处选中任务，再点下面按钮加入");

function sheetDay(){
  var ds=state.sheet.date;
  var isFuture=ds==="future";
  var list;
  var title;
  if(isFuture){
    list=state.tasks.filter(function(t){ return !t.reference && t.date && t.date>fmtYMD(dayAdd(TODAY,6)) && t.status!=="dropped"; })
      .sort(function(a,b){ return a.date.localeCompare(b.date)||sortTasks(a,b); });
    title="以后的安排";
  }else{
    list=tasksOn(ds);
    var d=new Date(ds+"T00:00:00");
    title=fmtMD(d)+" "+WD_CN[d.getDay()];
  }
  var body='';
  if(!list.length) body='<div class="empty">这天还没有安排</div>';
  else body=list.map(function(t){
    var meta=(prioText(t)?prioText(t)+" · ":"")+(t.time?t.time+" · ":"")+(t.anchor==="due"?"截止":"")+(isFuture?" · "+fmtShortDate(t.date):"");
    return '<div class="tr"><div class="check '+(t.status==="done"?"done":"")+'" data-act="toggle" data-id="'+esc(t.id)+'"></div>'
      +'<div class="trmain"><div class="trtitle '+(t.status==="done"?"done":"")+'" data-act="openTask" data-id="'+esc(t.id)+'">'+esc(t.title)+'</div>'
      +'<div class="trmeta">'+esc(meta)+'</div></div></div>';
  }).join("");
  body+='<div class="rowbtns"><button class="mini primary" data-act="addHere" data-date="'+ds+'">'+icon("plus",16)+'新增</button></div>';
  return sheetHead(title)+body;
}

  var pv=document.querySelector(".sheet .bbpreview");
  if(pv){
    if(title) pv.textContent=title;
    else pv.innerHTML='<span style="color:#C7C7CC">点上面的推荐或词块</span>';
  }
  var cnt=document.querySelector(".sheet .bbcount");
  if(cnt){
    var n=title.length;
    cnt.className="bbcount "+(n>12?"bad":n>6?"warn":"");
    cnt.textContent=n+"/"+(n>12?"最多 12":"目标 6");
  }
}
function sheetBB(){
  var b=state.bb;
  var sel=b.chunks.map(function(c,i){ return b.sel[i]?c:null; }).filter(Boolean).join("");
  var n=sel.length;
  var cls=n>12?"bad":n>6?"warn":"";

function parseCurrent(text){
  var arr=parseAll(text, TODAY, state.settings);
  for(var i=0;i<arr.length;i++) arr[i].note=text;
  return arr;
}
function setDrafts(arr){
  state.drafts=arr;
  state.draftSel=(arr||[]).map(function(){ return false; });
  // 只有一条时默认选中，省掉一次多余点击；多条时让用户自己点卡片选择。
  if(arr && arr.length===1) state.draftSel[0]=true;
}
function parseCheck(arr,text,base){
  base=base||TODAY;
  text=normalizeText(text);
  if(!arr.length) return {ok:false,msg:"没自动拆出：选标题和时间，直接存"};
  var dateHint=/(今天|明天|后天|大后天|昨天|前天|周[一二三四五六日天]|星期[一二三四五六日天]|礼拜[一二三四五六日天]|下周|本周|这周|下个?星期|上个?星期|这个?星期|下个?月|上个?月|\d{1,2}月\d{1,2}|月底|月初|下个?月底|下个?月初|\d{1,2}[日号])/.test(text);
  var anyDate=arr.some(function(t){return t.date||t.time;});
  if(dateHint && !anyDate) return {ok:false,msg:"日期没把握：去大爆炸手选"};
  if(arr.some(function(t){return (!t.title||t.title==="通知")&&!t.date&&!t.time;})) return {ok:false,msg:"有任务没把握：去大爆炸手选"};
  if(arr.some(function(t){return t.place && /(上午|下午|中午|晚上|早上|傍晚|月\d{1,2}|\d{1,2}月|周[一二三四五六日天]|\d{1,2}\s*点|之前|以前)/.test(t.place);})) return {ok:false,msg:"地点没把握：去大爆炸手选"};
  if(arr.some(function(t){return /(各位|接学校通知|收到请回复|提醒一下)/.test(t.title);})) return {ok:false,msg:"标题没洗干净：去大爆炸手选"};
  var clauses=taskClauseCount(text,base);
  if(!isNotice(text) && clauses>arr.length) return {ok:false,msg:"有 "+clauses+" 个任务片段只拆出 "+arr.length+" 条：去大爆炸核对"};
  return {ok:true,msg:""};
}
async function addDrafts(){
  if(state.addingDrafts) return;
  var list=state.drafts||[];
  var sel=state.draftSel||[];
  var picked=[];
  for(var i=0;i<list.length;i++){ if(sel[i]) picked.push(i); }
  if(!picked.length){ toast("先点卡片选择任务"); return; }
  state.addingDrafts=true;
  var btn=document.getElementById("addDraftsBtn"); if(btn) btn.disabled=true;
  var added=[];
  try{
    for(var j=0;j<picked.length;j++){
      var t=Object.assign({},list[picked[j]]);
      t.id=uid();
      if(!await putTask(t)){
        var afterFailure=list.filter(function(_,k){ return added.indexOf(k)<0; });
        state.drafts=afterFailure; state.draftSel=afterFailure.map(function(){ return false; });
        renderSheet(); return;
      }
      added.push(picked[j]); state.tasks.push(t);
    }
    var n=added.length;
    var remain=list.filter(function(_,k){ return added.indexOf(k)<0; });
    if(remain.length){
      state.drafts=remain;
      state.draftSel=remain.map(function(){ return false; });
      toast("已加入 "+n+" 条，还有 "+remain.length+" 条未加入");
      renderSheet();
    }else{
      state.drafts=null; state.draftSel=[]; state.sheet=null;
      toast("已加入 "+n+" 条");
      render();
    }
  }finally{ state.addingDrafts=false; }
}
function openEditor(kind, ref){
  var data;
  if(kind==="task"){
    var found=null;
    for(var i=0;i<state.tasks.length;i++){ if(state.tasks[i].id===ref){ found=state.tasks[i]; break; } }

    data=JSON.parse(JSON.stringify(state.drafts[ref]));

async function saveEditor(){
  if(state.saving) return;
  syncEditorFields();
  var e=state.editor; if(!e) return;
  var patch={
    title:String(e.data.title||"").trim()||"未命名",
    date:e.data.date||null, time:e.data.time||null,
    priority:normPriority(e.data.priority), place:String(e.data.place||"").trim(),
    note:e.data.note||"", updatedAt:Date.now(), anchor:e.data.anchor,
    status:e.data.status||"todo"
  };
  patch.doneAt=patch.status==="done"?(e.data.doneAt||Date.now()):null;
  if(e.kind==="draft"){
    Object.assign(state.drafts[e.ref],patch);
    state.sheet=e.back||{type:"paste"};
    renderSheet();
    return;
  }
  state.saving=true;
  var btn=document.querySelector(".save-editor"); if(btn) btn.disabled=true;
  try{
    if(e.isNew){
      var nt=Object.assign({},e.data,patch);
      nt.id=uid(); nt.createdAt=Date.now(); nt.updatedAt=Date.now(); nt.source=nt.source||"manual";
      if(!await putTask(nt)) return;
      state.tasks.push(nt);
      state.sheet=null; state.editor=null;
      render(); toast("已新增");
      return;
    }
    var t=null;
    for(var i=0;i<state.tasks.length;i++){ if(state.tasks[i].id===e.ref){ t=state.tasks[i]; break; } }
    if(t){
      var updated=Object.assign({},t,patch);
      if(!await putTask(updated)) return;
      Object.assign(t,patch);
    }
    state.sheet=e.back&&e.back.type==="day"?e.back:null;
    state.editor=null;
    render(); toast("已保存");
  }finally{
    state.saving=false;
    if(btn&&btn.isConnected) btn.disabled=false;
  }
}

function daysFromEpoch(y,m,d){
  return Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1899,11,1))/864e5);
}

  for(var i=0;i<12;i++) months.push((bits>>i&1)?30:29);
  var leapM=(bits>>12)&15, leapLen=(bits>>16&1)?30:29;
  var lm=1,ld=n2+1,isleap=false;
  for(var k=0;k<12;k++){
    var L=months[k];
    if(ld<=L) return {y:1900+yi,m:lm,d:ld,leap:false};
    ld-=L;
    if(leapM===k+1){
      if(ld<=leapLen) return {y:1900+yi,m:lm,d:ld,leap:true};
      ld-=leapLen;
    }
    lm++;
  }
  return null;
}
var LMONTH_CN=["正","二","三","四","五","六","七","八","九","十","冬","腊"];
var LDAY1=["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
function lunarText(lu){
  if(!lu) return "";
  if(lu.d===1) return (lu.leap?"闰":"")+LMONTH_CN[lu.m-1]+"月";
  return LDAY1[lu.d-1];
}

/* ===== 日历：全量渲染去年同月~明年同月（25 个月，无运行时增删，结构最简） ===== */
function calShift(y,m,off){ var t=y*12+(m-1)+off; return {y:Math.floor(t/12), m:t%12+1}; }
function renderMonthBlock(y,m){
  var first=new Date(y,m-1,1);
  var start=dayAdd(first,-first.getDay());
  var dim=new Date(y,m,0).getDate();
  var rows=(first.getDay()+dim>35)?42:35;
  var cells="";
  for(var i=0;i<rows;i++){
    var d=dayAdd(start,i);
    if(d.getMonth()!==m-1){ cells+='<div class="calcell empty"></div>'; continue; }
    cells+=calCell(d);
  }
  return '<div class="calmonth" data-my="'+(y*12+m)+'"><div class="calmhead">'+y+'年'+m+'月</div>'
    +'<div class="calwd"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>'
    +'<div class="calgrid">'+cells+'</div></div>';
}
function calCell(d){
  var ds=fmtYMD(d);
  var lu=lunarFromSolar(d.getFullYear(),d.getMonth()+1,d.getDate());
  var hol=HOLIDAYS[ds], work=WORKDAYS[ds];
  var weekend=(d.getDay()===0||d.getDay()===6);
  var cls="calcell";
  if(weekend) cls+=" wk";
  if(hol) cls+=" hol";
  if(work) cls+=" work";
  var todayMark="";
  if(ds===todayStr()){ cls+=" today"; todayMark=' data-today="1"'; }
  var tag=hol?'<span class="caltag hol">'+esc(hol)+'</span>':(work?'<span class="caltag work">班</span>':'');
  return '<div class="'+cls+'"'+todayMark+'><span class="cald">'+d.getDate()+'</span><span class="call">'+lunarText(lu)+'</span>'+tag+'</div>';
}
function renderCalendar(){
  ensureToday();
  var now=new Date(TODAY);
  var cy=now.getFullYear(), cm=now.getMonth()+1;
  var lo=calShift(cy,cm,-12), hi=calShift(cy,cm,12);
  var blocks="";
  for(var t=lo.y*12+lo.m;;){
    var y=Math.floor((t-1)/12), m=(t-1)%12+1;
    blocks+=renderMonthBlock(y,m);
    if(y===hi.y&&m===hi.m) break;
    t++;
  }
  var html='<div class="nav"><button class="icon-btn back" data-act="backHome" aria-label="返回主页" title="返回主页">'+icon("back",25)+'</button><span class="nt">日历</span><button class="icon-btn cal-today-btn" data-act="calToday" aria-label="回到今天" title="回到今天">'+icon("today",22)+'</button></div>'
    +'<div class="calscroll" id="calScroll">'+blocks+'</div>';
  return html;
}
function initCalendar(){
  var el=document.getElementById("calScroll");

}

var GestureGuard={until:0};
var Edge={tracking:false,active:false,settling:false,target:null,startX:0,startY:0,dx:0,dy:0,started:0,settleTimer:null};
var SheetDrag={tracking:false,active:false,settling:false,target:null,startX:0,startY:0,dx:0,dy:0,started:0,settleTimer:null};

function removeEdgeUnderlay(){
  var ul=document.getElementById("edge-underlay");
  if(ul && ul.parentNode) ul.parentNode.removeChild(ul);
}
function ensureEdgeUnderlay(){
  var ul=document.getElementById("edge-underlay");
  if(ul) return ul;
  ul=document.createElement("div");
  ul.id="edge-underlay";
  ul.style.transform="translateX("+(-window.innerWidth*0.28)+"px)";
  ul.innerHTML='<div class="ua">'+renderHome()+'</div>';
  var app=document.getElementById("app");
  document.body.insertBefore(ul,app);
  requestAnimationFrame(function(){ fitHomeCards(); });
  return ul;

function clearEdge(commit){
  var el=Edge.target, active=Edge.active;
  Edge.tracking=false; Edge.active=false; Edge.target=null;
  var ul=document.getElementById("edge-underlay");
  if(!el || !active){ removeEdgeUnderlay(); return; }
  Edge.settling=true;
  el.classList.remove("edge-dragging");
  el.classList.add("edge-settle");
  el.style.animation="none";
  el.style.transform=commit?"translateX(100%)":"translateX(0px)";
  if(ul){
    if(commit){ ul.style.transition="none"; ul.style.transform="translateX(0px)"; }
    else{ ul.style.transition="transform .26s cubic-bezier(.2,.8,.2,1)"; ul.style.transform="translateX("+(-window.innerWidth*0.28)+"px)"; }
  }
  clearTimeout(Edge.settleTimer);
  Edge.settleTimer=setTimeout(function(){
    el.style.transform="";
    el.classList.remove("edge-settle");
    Edge.settling=false;
    removeEdgeUnderlay();
    if(commit) goBack();
  },270);
}
document.addEventListener("touchstart",function(ev){
  if(ev.touches.length!==1 || state.quickMenu || Edge.settling || SheetDrag.settling) return;
  var t=ev.touches[0];
  if(state.sheet){
    var grabber=ev.target.closest?ev.target.closest("#sheet-root .grabber"):null;
    var sheet=grabber?grabber.closest(".sheet"):null;
    if(!sheet) return;
    SheetDrag.tracking=true; SheetDrag.active=false; SheetDrag.target=sheet;
    SheetDrag.startX=t.clientX; SheetDrag.startY=t.clientY; SheetDrag.dx=0; SheetDrag.dy=0; SheetDrag.started=Date.now();
    sheet.style.animation="none";
    var sheetBackdrop=document.querySelector("#sheet-root .backdrop");
    if(sheetBackdrop) sheetBackdrop.style.transition="none";
    return;
  }
  if(t.clientX>24) return;
  if(ev.target.closest && ev.target.closest("input,textarea,select,[contenteditable=true]")) return;
  var target=currentEdgeTarget();
  if(!target) return;
  Edge.tracking=true; Edge.active=false; Edge.target=target;
  Edge.startX=t.clientX; Edge.startY=t.clientY; Edge.dx=0; Edge.dy=0; Edge.started=Date.now();
},{passive:true});
document.addEventListener("touchmove",function(ev){
  if(SheetDrag.tracking){
    var st=ev.touches[0]; if(!st) return;
    var sdx=st.clientX-SheetDrag.startX, sdy=st.clientY-SheetDrag.startY;
    SheetDrag.dx=sdx; SheetDrag.dy=sdy;
    if(!SheetDrag.active){
      if((Math.abs(sdx)>12 && Math.abs(sdx)>Math.abs(sdy)) || sdy<-8){ SheetDrag.tracking=false; return; }
      if(sdy<6 || sdy<Math.abs(sdx)) return;
      SheetDrag.active=true;
      SheetDrag.target.classList.add("edge-dragging");
    }
    ev.preventDefault();
    var offset=Math.max(0,sdy);
    SheetDrag.target.style.transform="translateY("+offset+"px)";
    var sheetHeight=SheetDrag.target.offsetHeight||window.innerHeight;
    var sbd=document.querySelector("#sheet-root .backdrop");
    if(sbd) sbd.style.opacity=String(Math.max(0,1-offset/Math.max(160,sheetHeight*.8)));
    return;
  }
  if(!Edge.tracking) return;
  var t=ev.touches[0]; if(!t) return;
  var dx=t.clientX-Edge.startX, dy=t.clientY-Edge.startY;
  Edge.dx=dx; Edge.dy=dy;
  if(!Edge.active){
    if(Math.abs(dy)>12 && Math.abs(dy)>Math.abs(dx)){ Edge.tracking=false; return; }
    if(dx<10 || dx<Math.abs(dy)*1.2) return;
    Edge.active=true;
    if(Edge.target) Edge.target.classList.add("edge-dragging");
    ensureEdgeUnderlay();
  }
  ev.preventDefault();
  var w=window.innerWidth;
  var x=Math.max(0,Math.min(dx,w));
  if(Edge.target) Edge.target.style.transform="translateX("+x+"px)";
  var ul=document.getElementById("edge-underlay");
  if(ul) ul.style.transform="translateX("+(-(1-x/w)*w*0.28)+"px)";
},{passive:false});
function finishSheetDrag(cancelled){
  if(!SheetDrag.tracking) return;
  var el=SheetDrag.target, active=SheetDrag.active;
  var dx=SheetDrag.dx, dy=SheetDrag.dy, elapsed=Math.max(1,Date.now()-SheetDrag.started);
  SheetDrag.tracking=false; SheetDrag.active=false; SheetDrag.target=null;
  if(!el || !active){ if(el) el.style.animation=""; return; }
  var height=el.offsetHeight||window.innerHeight;
  var commit=!cancelled && (dy>Math.min(150,height*.3) || (dy>42 && dy/elapsed>.55)) && dy>Math.abs(dx)*1.1;
  var bd=document.querySelector("#sheet-root .backdrop");
  SheetDrag.settling=true;
  GestureGuard.until=Date.now()+340;
  el.classList.remove("edge-dragging");
  el.classList.add("edge-settle");
  el.style.transform=commit?"translateY(100%)":"translateY(0px)";
  if(bd){ bd.style.transition="opacity .26s cubic-bezier(.32,.72,0,1)"; bd.style.opacity=commit?"0":"1"; }
  clearTimeout(SheetDrag.settleTimer);
  SheetDrag.settleTimer=setTimeout(function(){
    el.style.transform="";
    el.classList.remove("edge-settle");
    if(bd){ bd.style.opacity=""; bd.style.transition=""; }
    SheetDrag.settling=false;
    if(commit) goBack();
  },270);
}
function finishEdge(ev,cancelled){
  if(!Edge.tracking) return;
  var active=Edge.active, dx=Edge.dx, dy=Edge.dy, elapsed=Math.max(1,Date.now()-Edge.started);
  if(active){
    GestureGuard.until=Date.now()+340;
    var commit=!cancelled && (dx>76 || (dx>38 && dx/elapsed>.55)) && dx>Math.abs(dy)*1.15;
    clearEdge(commit);
  }else clearEdge(false);
}
document.addEventListener("touchend",function(ev){ finishSheetDrag(false); finishEdge(ev,false); },{passive:true});
document.addEventListener("touchcancel",function(ev){ finishSheetDrag(true); finishEdge(ev,true); },{passive:true});

  if(act==="delEditing"){
    if(state.editor && state.editor.isNew){ state.sheet=null; state.editor=null; renderSheet(); return; }
    if(!confirm("删除这条任务？")) return;
    if(state.editor.kind==="draft"){
      state.drafts.splice(state.editor.ref,1);
      if(state.draftSel) state.draftSel.splice(state.editor.ref,1);
      state.sheet={type:"paste"};
      state.editor=null; renderSheet(); return;
    }
    var did=state.editor.ref;
    if(!await deleteStoredTask(did)) return;
    state.tasks=state.tasks.filter(function(x){return x.id!==did;});
    state.sheet=null; state.editor=null;
    render();
    return;
  }
  if(act==="toToday"){
    var tid=el.dataset.id;
    for(var q=0;q<state.tasks.length;q++){
      if(state.tasks[q].id===tid){
        var moved=Object.assign({},state.tasks[q],{date:todayStr(),updatedAt:Date.now()});
        if(!await putTask(moved)) return;
        state.tasks[q]=moved;
      }
    }
    render(); toast("已排到今天");
    return;
  }
  if(act==="delTask"){
    if(!confirm("删除这条任务？")) return;
    var did2=el.dataset.id;
    if(!await deleteStoredTask(did2)) return;
    state.tasks=state.tasks.filter(function(x){return x.id!==did2;});
    render(); return;
  }
  if(act==="delOverdue"){
    var ov=inboxTasks().overdue;
    if(!ov.length) return;
    if(!confirm("删除全部 "+ov.length+" 条逾期任务？")) return;
    var ids=ov.map(function(t){return t.id;});
    var delOk=0;
    for(var oi=0;oi<ids.length;oi++){ if(await deleteStoredTask(ids[oi])) delOk++; }
    state.tasks=state.tasks.filter(function(x){return ids.indexOf(x.id)<0;});
    render();
    toast("已删除 "+delOk+" 条逾期任务");
    return;
  }
  if(act==="addHere"){
    var date=el.dataset.date==="future"?null:el.dataset.date;
    var blank={id:"",title:"新任务",raw:"",note:"",agenda:[],anchor:"due",date:date,time:null,endTime:null,place:"",category:"个人",tags:[],priority:1,status:"todo",doneAt:null,leadDays:null,repeat:null,source:"manual",relevant:true,reference:false,batchId:"",createdAt:Date.now(),updatedAt:Date.now()};
    state.editor={kind:"task",ref:"",data:blank,back:{type:"day",date:el.dataset.date}};
    state.sheet={type:"editor"};
    // 新建：保存时插入
    state.editor.isNew=true;
    renderSheet();
    return;
  }
  if(act==="backHome"){ state.quickMenu=false; state.view="home"; render(); return; }
  if(act==="calToday"){
    var cs=document.getElementById("calScroll");
    if(cs){
      var td=cs.querySelector("[data-today]");
      if(td){ cs.scrollTo({top:td.offsetTop-cs.clientHeight/2,behavior:"smooth"}); toast("已回到今天"); }
    }
    return;
  }
  if(act==="openInbox"){ state.quickMenu=false; state.view="inbox"; render(); return; }
  if(act==="openCalendar"){ state.quickMenu=false; state.view="calendar"; render(); return; }
  if(act==="openSettings"){ state.quickMenu=false; state.view="settings"; render(); return; }
  if(act==="share"){ shareBackup(); return; }
  if(act==="importBtn"){ var f=document.getElementById("importFile"); if(f) f.click(); return; }
  if(act==="clear"){
    if(!confirm("清空全部任务？这个操作不能撤销。")) return;
    try{ await Store.clear(); }
    catch(e){ state.tasks=await Store.all(); render(); toast("清空未完全成功，请重试"); return; }
    state.tasks=[]; render(); toast("已清空"); return;
  }
});

document.addEventListener("input", function(ev){
  if(ev.target.id==="pasteInput"){ state.parseText=ev.target.value; }
  if(/^e_(title|date|time|place|note)$/.test(ev.target.id)) syncEditorFields();
});

document.addEventListener("change", function(ev){
  var id=ev.target.id, v=ev.target.value;
  if(id==="s_week"){ state.settings.weekOneMonday=v; saveSettings(); render(); }
  else if(id==="s_oddeven"){ state.settings.oddEvenStart=v; saveSettings(); render(); }
  else if(id==="s_theme"){ state.settings.theme=v==="pink"?"pink":"blue"; saveSettings(); applyTheme(); }
  else if(id==="importFile"){
    var f=ev.target.files&&ev.target.files[0]; if(!f) return;
    if(f.size>5*1024*1024){ toast("备份文件不能超过 5 MB"); ev.target.value=""; return; }
    var rd=new FileReader();
    rd.onload=function(){ importFromText(rd.result); };
    rd.onerror=function(){ toast("读取备份文件失败"); };
    rd.readAsText(f);
    ev.target.value="";
  }
});

document.addEventListener("paste", function(ev){
  var el=ev.target;
  if(el&&el.id==="importText"){
    var text=(ev.clipboardData||window.clipboardData).getData("text");
    if(!text||!text.trim()) return;
    ev.preventDefault();
    el.value=text.trim();
    importFromText(text);
  }
});

async function importBackupData(data){
  if(!data||!Array.isArray(data.tasks)) throw new Error("格式不对");
  if(data.tasks.length>5000) throw new Error("备份任务过多");
  if(state.importing) return null;
  state.importing=true;
  var result={added:0,updated:0,invalid:0,older:0,deleted:0,failed:false};
  try{
    for(var i=0;i<data.tasks.length;i++){
      var t=sanitizeImportedTask(data.tasks[i],data.priorityModel!==2);
      if(!t){ result.invalid++; continue; }
      var existing=-1;
      for(var j=0;j<state.tasks.length;j++){ if(state.tasks[j].id===t.id){ existing=j; break; } }
      if(existing>=0&&taskVersion(t)<=taskVersion(state.tasks[existing])){ result.older++; continue; }
      if(existing<0&&Store.deleted[t.id]&&taskVersion(t)<=Store.deleted[t.id]){ result.deleted++; continue; }
      try{ await Store.put(t); }
      catch(e){ result.failed=true; break; }
      if(existing>=0){ state.tasks[existing]=t; result.updated++; }
      else{ state.tasks.push(t); result.added++; }
    }
    sanitizeImportedSettings(data.settings); saveSettings();
    var msg=result.failed?"导入中断：已写入 "+(result.added+result.updated)+" 条，请重试":"导入完成：新增 "+result.added+" 条，更新 "+result.updated+" 条";
    var skipped=result.invalid+result.older+result.deleted;
    if(skipped) msg+="，跳过 "+skipped+" 条";
    toast(msg);
    return result;
  }finally{ state.importing=false; }
}
function validDateString(s){
  if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var p=s.split("-").map(Number), d=new Date(p[0],p[1]-1,p[2]);
  return d.getFullYear()===p[0]&&d.getMonth()===p[1]-1&&d.getDate()===p[2];
}
function sanitizeImportedTask(raw, legacyPriority){
  if(!raw || typeof raw!=="object") return null;
  var t=Object.assign({},raw);
  t.id=(typeof t.id==="string"&&t.id.trim()&&t.id.trim().length<=100)?t.id.trim():uid();
  t.title=String(t.title||"").trim().slice(0,80)||"未命名任务";
  t.raw=String(t.raw||t.note||"").slice(0,20000);
  t.note=String(t.note||t.raw||"").slice(0,20000);
  t.agenda=Array.isArray(t.agenda)?t.agenda.filter(function(x){return x!=null && String(x).trim();}).slice(0,100).map(function(x){return String(x).slice(0,1000);}):[];
  if(t.date!=null&&t.date!==""&&!validDateString(t.date)) return null;
  t.date=validDateString(t.date)?t.date:null;
  t.time=(typeof t.time==="string"&&/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(t.time))?t.time:null;
  t.endTime=(typeof t.endTime==="string"&&/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(t.endTime))?t.endTime:null;
  t.anchor=t.anchor==="due"?"due":"occur";
  t.category=["进修","材料","班务","个人"].indexOf(t.category)>=0?t.category:"个人";
  t.tags=Array.isArray(t.tags)?t.tags.slice(0,20).map(function(x){return String(x).slice(0,40);}):[];
  t.priority=legacyPriority?1:normPriority(t.priority);
  t.status=["todo","done","dropped"].indexOf(t.status)>=0?t.status:"todo";
  t.doneAt=typeof t.doneAt==="number"&&Number.isFinite(t.doneAt)?t.doneAt:null;
  t.leadDays=(t.leadDays!=null && Number.isFinite(+t.leadDays))?+t.leadDays:null;
  t.repeat=typeof t.repeat==="string"?t.repeat.slice(0,100):null;
  t.source=String(t.source||"import").slice(0,40);
  t.relevant=true;
  t.reference=!!t.reference;
  t.batchId=String(t.batchId||"").slice(0,100);
  t.createdAt=Number.isFinite(+t.createdAt)?+t.createdAt:Date.now();
  t.updatedAt=Number.isFinite(+t.updatedAt)?+t.updatedAt:0;
  return t;
}
function sanitizeImportedSettings(raw){
  if(!raw || typeof raw!=="object") return;
  if(validDateString(raw.weekOneMonday)) state.settings.weekOneMonday=raw.weekOneMonday;
  if(raw.oddEvenStart==="odd"||raw.oddEvenStart==="even") state.settings.oddEvenStart=raw.oddEvenStart;
  if(raw.theme==="blue"||raw.theme==="pink") state.settings.theme=raw.theme;
  if(typeof raw.semesterName==="string") state.settings.semesterName=raw.semesterName.slice(0,40);
  if(Number.isFinite(+raw.lastExport)) state.settings.lastExport=+raw.lastExport;
}
function backupPayload(){ return {version:2,priorityModel:2,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),settings:state.settings,tasks:state.tasks}; }
function copyText(str,ok,fail){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(ok,fail);
  }else{
    var ta=document.createElement("textarea"); ta.value=str; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ fail(); }
    ta.remove();
  }
}
function bytesToBase64Url(bytes){
  var bin="", CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH){ bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH)); }
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function base64UrlToBytes(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  var bin=atob(s), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function makeBackupCode(json){
  var bytes=new TextEncoder().encode(json);
  if(window.CompressionStream){
    var cs=new CompressionStream("deflate-raw");
    bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
  }
  return "RG1."+bytesToBase64Url(bytes);
}
async function parseBackupText(str){
  str=(str||"").trim();
  if(!str) throw new Error("空的备份内容");
  if(str.indexOf("RG1.")===0){
    var bytes=base64UrlToBytes(str.slice(4));
    if(window.DecompressionStream){
      var ds=new DecompressionStream("deflate-raw");
      str=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    }else{
      str=new TextDecoder().decode(bytes);
    }
  }
  return JSON.parse(str);
}
function downloadBackupFile(){
  var str=JSON.stringify(backupPayload(),null,2);
  var blob=new Blob([str],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="日格备份-"+fmtYMD(new Date())+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
}
async function shareBackup(){
  var json=JSON.stringify(backupPayload());
  var code=null;
  try{ code=await makeBackupCode(json); }catch(e){}
  state.settings.lastExport=Date.now(); saveSettings();
  if(code&&code.length<=4000){
    copyText(code,
      function(){ toast("备份码已复制，粘贴到微信发给新设备"); },
      function(){ toast("复制失败，请长按版本号旁重新分享"); });
  }else{
    downloadBackupFile();
    toast("数据较多，已生成备份文件下载");
  }
}
async function importFromText(str){
  if(state.importing){ toast("正在导入，请稍候"); return; }
  try{
    var data=await parseBackupText(str);
    var result=await importBackupData(data);
    if(result){
      render();
      var el=document.getElementById("importText"); if(el) el.value="";
    }
  }catch(e){
    toast(e.message==="备份任务过多"?"导入失败：最多支持 5000 条任务":"导入失败，备份码或文件格式不对");
  }
}

async function migrateTaskPriorities(){
  try{
    if(localStorage.getItem("rige_priority_model")==="2") return;
    for(var i=0;i<state.tasks.length;i++){
      var t=state.tasks[i];
      if(normPriority(t.priority)!==1 || typeof t.priority!=="number"){
        var migrated=Object.assign({},t,{priority:1});
        await Store.put(migrated);
        state.tasks[i]=migrated;
      }
    }
    localStorage.setItem("rige_priority_model","2");
  }catch(e){}
}
async function boot(){
  await Store.init();
  state.tasks=await Store.all();
  await migrateTaskPriorities();
  applyTheme();
  render();
}
if(typeof document!=="undefined" && document.getElementById) boot();
setInterval(refreshToday, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshToday(); });
window.addEventListener("focus", refreshToday);
/* PWA：HTTPS/localhost 下注册 Service Worker；file:// 直接打开时不影响原有用法 */
if(typeof navigator!=="undefined" && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});
  });
}
